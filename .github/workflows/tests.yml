name: tests

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy types-requests
      - name: Run mypy
        run: |
          mypy --ignore-missing-imports --python-version 3.10 \
            --disable-error-code=var-annotated \
            cppassistant/ CppAssistant.py

  unittest:
    name: Unit Tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  libclang-test:
    name: libclang Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LLVM
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev
      - name: Run libclang tests
        env:
          CA_TEST_LIBCLANG_PCH: 1
        run: python -m unittest tests.test_semantic_engine -v

  package:
    name: Build Package
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unittest, libclang-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create .sublime-package
        run: |
          zip -r CppAssistant.sublime-package . \
            -x "*.git*" -x "*/__pycache__/*" -x "*.pyc" \
            -x "tests/*" -x ".github/*" -x ".mypy_cache/*" \
            -x ".pytest_cache/*" -x "*.egg-info/*" \
            -x ".gitignore" -x ".gitattributes"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CppAssistant.sublime-package
          path: CppAssistant.sublime-package

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: CppAssistant.sublime-package
          path: .
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: CppAssistant.sublime-package
          generate_release_notes: true