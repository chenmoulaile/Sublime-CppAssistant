name: tests

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install flake8
        run: pip install flake8
      - name: Run flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install mypy
        run: pip install mypy types-requests
      - name: Run mypy
        run: |
          mypy --ignore-missing-imports --python-version 3.10 \
            cppassistant/ CppAssistant.py || true

  unittest:
    name: Unit Tests
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  libclang-test:
    name: libclang Tests (opt-in)
    runs-on: ubuntu-24.04
    if: ${{ env.CA_TEST_LIBCLANG_PCH == '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LLVM
        run: |
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          sudo apt-add-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-18 main"
          sudo apt-get update
          sudo apt-get install -y libclang-18-dev clang-18
      - name: Run libclang tests
        env:
          CA_TEST_LIBCLANG_PCH: 1
        run: python -m unittest tests.test_semantic_engine -v

  package:
    name: Build Package
    runs-on: ubuntu-24.04
    needs: [lint, typecheck, unittest]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create .sublime-package
        run: |
          zip -r CppAssistant.sublime-package . \
            -x "*.git*" -x "*/__pycache__/*" -x "*.pyc" \
            -x "tests/*" -x ".github/*" -x "*.md" -x "LICENSE" \
            -x "CHANGELOG.md" -x ".gitignore" -x ".gitattributes"
      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: CppAssistant.sublime-package
          path: CppAssistant.sublime-package

  release:
    name: Create Release
    runs-on: ubuntu-24.04
    needs: [package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: CppAssistant.sublime-package
          path: .
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: CppAssistant.sublime-package
          generate_release_notes: true